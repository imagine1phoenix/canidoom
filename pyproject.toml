[project]
name = "devforge-doom-template"
version = "0.1.0"
description = "Starter template for DevForge 'Can It Play DOOM?' (Yugaantar 2026)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "doom-env",
    "vizdoom==1.3.3",
    "gymnasium>=1.0",
    "numpy>=2.0",
    "torch>=2.0",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.8",
    "scipy>=1.11",
    "einops>=0.7",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "wandb>=0.18",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
doom-env = { path = "env", editable = true }
