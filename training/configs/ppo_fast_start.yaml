# Fast-start curriculum for MacBook CPU / early Tier 1-2 mastery
seed: 42
num_envs: 8
rollout_steps: 128
bptt_len: 32
ppo_epochs: 4
minibatch_chunks: 8
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
lr: 3.0e-4
max_grad_norm: 0.5
vf_coef: 0.5
ent_coef: 0.015
ent_coef_start: 0.02
ent_coef_end: 0.005
rnd_coef: 0.06
grid_novelty_coef: 0.04
aux_coef: 0.10
compass_coef: 0.15
bc_kl_beta_init: 0.0
bc_enabled: false
bc_warmstart_path: null
rgb_dropout_p: 0.0
scaffolding_end_step: 1000000
total_updates: 2500
save_interval: 10
latest_interval: 2
coach_interval: 25
output_dir: "runs/ppo_fast_start"
best_out: ""
tier_weights: [3.0, 2.5, 1.5, 0.5]
worker_max_episodes: 100
worker_timeout_s: 15.0
render_buffers_ratio: 0.25

cpu_threads: 1
max_vram_mb: 2048
max_ram_mb: 8192
agent_ms_per_step: 40.0

use_llm_coach: false
wandb_project: "devforge-doom"
wandb_enabled: false

model_config:
  d_model: 256
  gru_dim: 256
  num_slots: 4
  slot_dim: 8
  use_rgb: true
  use_grid: true

plr:
  buffer_size: 256
  seed_min: 100000
  seed_max: 999999
  replay_prob: 0.5
